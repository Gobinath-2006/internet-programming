<!DOCTYPE html>
<html>
<head>
    <title>User Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 28px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #334155;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.12);
        }

        .register-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #4f46e5;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .register-btn:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #94a3b8;
            font-size: 12px;
        }

        .required {
            color: #ef4444;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="card">

        <div class="header">
            <h1>Create Account</h1>
            <p>Enter your details to complete registration</p>
        </div>

        <form method="POST" action="validate.php">

            <div class="form-group">
                <label>
                    Full Name <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="fullname"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="form-group">
                <label>
                    Email Address <span class="required">*</span>
                </label>
                <input
                    type="email"
                    name="email"
                    placeholder="example@email.com"
                    required>
            </div>

            <div class="form-group">
                <label>
                    Password <span class="required">*</span>
                </label>
                <input
                    type="password"
                    name="password"
                    placeholder="Minimum 8 characters"
                    required>
            </div>

            <div class="form-group">
                <label>
                    Credit Card Number <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="ccnumber"
                    placeholder="16 digit card number"
                    maxlength="16"
                    required>
            </div>

            <div class="form-group">
                <label>
                    Phone Number <span class="required">*</span>
                </label>
                <input
                    type="text"
                    name="phone"
                    placeholder="10 digit mobile number"
                    maxlength="10"
                    required>
            </div>

            <button type="submit" class="register-btn">
                Register Account
            </button>

        </form>

        <div class="footer">
            Server-Side Validation using PHP
        </div>

    </div>

</div>

</body>
</html>
