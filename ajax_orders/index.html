<!DOCTYPE html>
<html>

<head>

    <title>Online Shopping - Order Viewer</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #dbeafe);
            padding: 50px 20px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .card {
            background: white;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.12);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #1e293b;
            font-size: 30px;
            margin-bottom: 8px;
        }

        .header p {
            color: #64748b;
            font-size: 14px;
        }

        .button-area {
            text-align: center;
            margin-bottom: 30px;
        }

        button {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 13px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #4338ca;
            transform: translateY(-1px);
        }

        #orderData {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            overflow: hidden;
            border-radius: 10px;
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 15px;
            text-align: left;
        }

        td {
            padding: 14px 15px;
            border-bottom: 1px solid #e2e8f0;
            color: #334155;
        }

        tr:nth-child(even) {
            background: #f8fafc;
        }

        tr:hover {
            background: #eef2ff;
        }

        .price {
            font-weight: bold;
            color: #16a34a;
        }

        .status {
            text-align: center;
            color: #64748b;
            padding: 20px;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #94a3b8;
            font-size: 13px;
        }

    </style>


    <script>

        function loadOrders() {

            var xhttp = new XMLHttpRequest();

            xhttp.onreadystatechange = function () {

                if (this.readyState == 4 && this.status == 200) {

                    var xml = this.responseXML;

                    var orders =
                        xml.getElementsByTagName("order");

                    var output = "";

                    output += "<table>";

                    output += "<tr>";
                    output += "<th>Order ID</th>";
                    output += "<th>Customer</th>";
                    output += "<th>Product</th>";
                    output += "<th>Quantity</th>";
                    output += "<th>Price</th>";
                    output += "</tr>";


                    for (var i = 0; i < orders.length; i++) {

                        var o = orders[i];

                        function val(tag) {
                            return o
                                .getElementsByTagName(tag)[0]
                                .childNodes[0]
                                .nodeValue;
                        }

                        var id = val("id");
                        var customer = val("customer");
                        var product = val("product");
                        var quantity = val("quantity");
                        var price = val("price");


                        output += "<tr>";

                        output += "<td>" + id + "</td>";

                        output += "<td>" + customer + "</td>";

                        output += "<td>" + product + "</td>";

                        output += "<td>" + quantity + "</td>";

                        output += "<td class='price'>₹" +
                                  price +
                                  "</td>";

                        output += "</tr>";
                    }


                    output += "</table>";

                    document.getElementById("orderData").innerHTML =
                        output;

                }

            };


            xhttp.open("GET", "orders.xml", true);

            xhttp.send();

        }

    </script>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>Online Shopping - Order Viewer</h1>

            <p>
                Asynchronous Client-Server Interaction using AJAX and XML
            </p>

        </div>


        <div class="button-area">

            <button onclick="loadOrders()">
                Load Orders
            </button>

        </div>


        <div id="orderData">

            <div class="status">
                Click "Load Orders" to display order details.
            </div>

        </div>


        <div class="footer">

            AJAX + XML Experiment

        </div>

    </div>

</div>

</body>

</html>
